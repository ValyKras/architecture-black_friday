name: sharding-repl-cache

x-mongo-healthcheck: &mongo-healthcheck
  test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping: 1}).ok"]
  interval: 5s
  timeout: 5s
  retries: 20
  start_period: 15s

services:
  configSrv:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    networks: [app-network]
    volumes:
      - config-data:/data/db
    command: ["mongod", "--configsvr", "--replSet", "config_server", "--bind_ip_all", "--port", "27017"]
    healthcheck: *mongo-healthcheck

  shard1_1:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27018:27018"
    networks: [app-network]
    volumes:
      - shard1-1-data:/data/db
    command: ["mongod", "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018"]
    healthcheck:
      <<: *mongo-healthcheck
      test: ["CMD", "mongosh", "--quiet", "--port", "27018", "--eval", "db.adminCommand({ping: 1}).ok"]

  shard1_2:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27028:27028"
    networks: [app-network]
    volumes:
      - shard1-2-data:/data/db
    command: ["mongod", "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27028"]
    healthcheck:
      <<: *mongo-healthcheck
      test: ["CMD", "mongosh", "--quiet", "--port", "27028", "--eval", "db.adminCommand({ping: 1}).ok"]

  shard1_3:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27038:27038"
    networks: [app-network]
    volumes:
      - shard1-3-data:/data/db
    command: ["mongod", "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27038"]
    healthcheck:
      <<: *mongo-healthcheck
      test: ["CMD", "mongosh", "--quiet", "--port", "27038", "--eval", "db.adminCommand({ping: 1}).ok"]

  shard2_1:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27019:27019"
    networks: [app-network]
    volumes:
      - shard2-1-data:/data/db
    command: ["mongod", "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27019"]
    healthcheck:
      <<: *mongo-healthcheck
      test: ["CMD", "mongosh", "--quiet", "--port", "27019", "--eval", "db.adminCommand({ping: 1}).ok"]

  shard2_2:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27029:27029"
    networks: [app-network]
    volumes:
      - shard2-2-data:/data/db
    command: ["mongod", "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27029"]
    healthcheck:
      <<: *mongo-healthcheck
      test: ["CMD", "mongosh", "--quiet", "--port", "27029", "--eval", "db.adminCommand({ping: 1}).ok"]

  shard2_3:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27039:27039"
    networks: [app-network]
    volumes:
      - shard2-3-data:/data/db
    command: ["mongod", "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27039"]
    healthcheck:
      <<: *mongo-healthcheck
      test: ["CMD", "mongosh", "--quiet", "--port", "27039", "--eval", "db.adminCommand({ping: 1}).ok"]

  init-replica-sets:
    image: mongo:7.0
    entrypoint: ["bash", "/scripts/setup-sharded-cluster.sh", "replica-sets"]
    restart: "no"
    networks: [app-network]
    volumes:
      - ./scripts/setup-sharded-cluster.sh:/scripts/setup-sharded-cluster.sh:ro
    depends_on:
      configSrv:
        condition: service_healthy
      shard1_1:
        condition: service_healthy
      shard1_2:
        condition: service_healthy
      shard1_3:
        condition: service_healthy
      shard2_1:
        condition: service_healthy
      shard2_2:
        condition: service_healthy
      shard2_3:
        condition: service_healthy

  mongos_router:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27020:27020"
    networks: [app-network]
    command: ["mongos", "--configdb", "config_server/configSrv:27017", "--bind_ip_all", "--port", "27020"]
    depends_on:
      init-replica-sets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "27020", "--eval", "db.adminCommand({ping: 1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  init-sharding:
    image: mongo:7.0
    entrypoint: ["bash", "/scripts/setup-sharded-cluster.sh", "sharding"]
    restart: "no"
    networks: [app-network]
    volumes:
      - ./scripts/setup-sharded-cluster.sh:/scripts/setup-sharded-cluster.sh:ro
    depends_on:
      mongos_router:
        condition: service_healthy

  check-sharded-cluster:
    image: mongo:7.0
    profiles: ["tools"]
    entrypoint: ["bash", "/scripts/setup-sharded-cluster.sh", "check"]
    networks: [app-network]
    volumes:
      - ./scripts/setup-sharded-cluster.sh:/scripts/setup-sharded-cluster.sh:ro
    depends_on:
      mongos_router:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks: [app-network]
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pymongo_api:
    build:
      context: ./api_app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGODB_URL: mongodb://mongos_router:27020
      MONGODB_DATABASE_NAME: somedb
      REDIS_URL: redis://redis:6379/0
    networks: [app-network]
    depends_on:
      init-sharding:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  app-network:
    driver: bridge

volumes:
  config-data:
  shard1-1-data:
  shard1-2-data:
  shard1-3-data:
  shard2-1-data:
  shard2-2-data:
  shard2-3-data:
  redis-data:
